[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codebot"
version = "0.17"
description = "Code Bot - USB info display host daemon for CH32X033F8P6"
authors = [{name = "Code Bot Project"}]
readme = "README.md"
requires-python = ">=3.8,<3.14"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "pyusb>=1.2.1",
    "psutil>=5.9.0",
    "Pillow>=10.0.0,<11",
    "PyYAML>=6.0",
    "click>=8.1.0",
    "platformdirs>=4.0",
    # Python 3.8 lacks `importlib.resources.files` (added in 3.9); backport it
    # only on the affected versions so 3.9+ users don't pull an extra dep.
    'importlib_resources>=1.3; python_version < "3.9"',
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.0.280",
]

[project.scripts]
codebotd = "codebot.cli:main"
# Console scripts that Claude Code invokes from its hook configuration.
# Available on PATH after `pip install codebot` on every platform
# (Windows / macOS / Linux). Claude Code's hook.command runs in the
# system shell which searches PATH, so we never hardcode a path here.
codebot-claude-statusline = "codebot.claude_integration.statusline:main"
codebot-claude-status-hook = "codebot.claude_integration.hook:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codebot = [
    "py.typed",
    "fonts/*.ttf",
    "icons/*.png",
    "udev/*.rules",
    "windows/*.inf",
    # Service-unit templates (filled at install time via `codebotd setup`).
    # `.in` suffix is the autoconf/CMake convention — install code does the
    # @CODEBOTD_PATH@ substitution before writing to ~/.config/systemd/user
    # or ~/Library/LaunchAgents.
    "systemd/*.service.in",
    "launchd/*.plist.in",
    # P3.3: Windows vendor libusb.dll (fallback when WinUSB unavailable)
    "_vendor/libusb/windows-*/*.dll",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
