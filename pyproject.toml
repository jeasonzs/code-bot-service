[build-system]
requires = [
    "setuptools>=64",
    "setuptools-scm",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "codebot"
dynamic = ["version"]
description = "Code Bot - USB info display host daemon for CH32X033F8P6"
authors = [{name = "Code Bot Project"}]
readme = "README.md"
requires-python = ">=3.8,<3.14"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "pyusb>=1.2.1",
    "psutil>=5.9.0",
    "Pillow>=10.0.0,<11",
    "PyYAML>=6.0",
    "click>=8.1.0",
    "platformdirs>=4.0",
    'importlib_resources>=1.3; python_version < "3.9"',
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.0.280",
]

[project.scripts]
codebotd = "codebot.cli:main"
codebot-claude-statusline = "codebot.claude_integration.statusline:main"
codebot-claude-status-hook = "codebot.claude_integration.hook:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codebot = [
    "py.typed",
    "fonts/*.ttf",
    "icons/*.png",
    "udev/*.rules",
    "windows/*.inf",
    "systemd/*.service.in",
    "launchd/*.plist.in",
    "_vendor/libusb/windows-*/*.dll",
]

[tool.setuptools_scm]
# 可选：将版本信息写入 Python 文件，运行时可以读取
version_file = "src/codebot/_version.py"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"